<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VEILWAKE — tests</title>

<!-- Same vendored Three.js the game uses, resolved from here rather than the
     project root. The tests must exercise the shipped module, not a copy. -->
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 28px; background: #05070b; color: #b9c7da;
    font: 13px/1.7 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  h1 { font-size: 15px; letter-spacing: .26em; color: #e6f0fb; margin: 0 0 2px; font-weight: 500; }
  h2 { font-size: 12px; letter-spacing: .18em; color: #7e93ab; margin: 22px 0 6px; font-weight: 500; text-transform: uppercase; }
  .sub { color: #6f8299; margin-bottom: 20px; }
  #summary { font-size: 14px; margin-bottom: 6px; }
  .ok { color: #8fe3a8; } .bad { color: #ff8b8b; } .dim { color: #55677e; } .wait { color: #ffd08a; }
  table { border-collapse: collapse; max-width: 900px; width: 100%; }
  td { padding: 3px 10px 3px 0; vertical-align: top; border-bottom: 1px solid #121b26; }
  td.v { width: 52px; }
  td.n { color: #cfe2f5; }
  td.d { color: #55677e; text-align: right; white-space: nowrap; }
  /* The game runs for real, off-screen. A fake renderer would drift from the
     shipped one and the mood suite would slowly stop meaning anything. */
  #rig { position: fixed; left: -3000px; top: 0; width: 960px; height: 540px; border: 0; }
</style>
</head>
<body>
<h1>VEILWAKE</h1>
<div class="sub">control polarity, and the art direction as a regression test</div>
<div id="summary" class="wait">running…</div>
<div id="suites"></div>

<iframe id="rig" src="../index.html" title="game under test"></iframe>

<script type="module">
const v = Date.now();
const summary = document.getElementById('summary');
const suites = document.getElementById('suites');
let pass = 0, fail = 0;

function render(title, r, note) {
  pass += r.pass; fail += r.fail.length;
  const h = document.createElement('h2');
  h.textContent = title + (note ? ` — ${note}` : '');
  suites.appendChild(h);
  const table = document.createElement('table');
  for (const x of r.results) {
    const tr = document.createElement('tr');
    const detail = x.detail
      ? `turn ${(+x.detail.sideways).toFixed(3)} · nose ${(+x.detail.vertical).toFixed(3)} · wing ${(+x.detail.wing).toFixed(3)}`
      : (x.want ? `want ${x.want}` : '');
    tr.innerHTML =
      `<td class="v ${x.ok ? 'ok' : 'bad'}">${x.ok ? 'pass' : 'FAIL'}</td>` +
      `<td class="n">${x.name}</td>` +
      `<td class="${x.ok ? 'dim' : 'bad'}">${x.ok ? x.got ?? x.want ?? '' : `wanted ${x.want}, got ${x.got}`}</td>` +
      `<td class="d">${detail}</td>`;
    table.appendChild(tr);
  }
  suites.appendChild(table);
}

function finish() {
  summary.className = fail ? 'bad' : 'ok';
  summary.textContent = fail ? `${fail} FAILED — ${pass} passed` : `all ${pass} passed`;
}

// --- headless suites: no GPU needed ---------------------------------------
//
// Every suite in tests/ runs here. The runner used to import only two of the
// four and reported "all 21 passed" while 58 further cases sat unrun, seven of
// them red. A runner that hides suites is worse than no runner, because it
// converts an unknown into a false assurance.
const HEADLESS = [
  ['./controls.test.js', 'control polarity', 'measured against real ship motion'],
  ['./lights.test.js', 'light registry', 'packing, culling and the shadow budget'],
  ['./creature.test.js', 'creature contract', 'transmission, attention and the state machine'],
  ['./lantern.test.js', 'the Lantern', 'the dimming, and why it is not a timer'],
  ['./wakehunter.test.js', 'the Wake Hunter', 'it follows the trail, and cannot smell the ship'],
  ['./choir.test.js', 'the Choir', 'it repeats, it never commits, and it never invents'],
];
for (const [path, title, note] of HEADLESS) {
  try {
    const mod = await import(`${path}?v=${v}`);
    render(title, mod.run(), note);
  } catch (e) {
    const h = document.createElement('h2');
    h.className = 'bad';
    h.textContent = `${title} — COULD NOT RUN: ${e.message}`;
    suites.appendChild(h);
    fail += 1;
  }
}

// --- suites that need the real renderer -----------------------------------
// Driving the shipped page rather than a stand-in, so the mood suite is
// measuring the game the player gets.
const rig = document.getElementById('rig');
try {
  // Polled rather than waiting on `load`. Two races otherwise: the iframe can
  // finish loading before this listener is attached, in which case the event
  // never fires; and `load` means the document parsed, not that the module which
  // defines GAME has run. Polling is immune to both.
  const GAME = await (async () => {
    const deadline = performance.now() + 25000;
    for (;;) {
      const g = rig.contentWindow && rig.contentWindow.GAME;
      if (g) { await g.ready; return g; }
      if (performance.now() > deadline) throw new Error('game did not boot within 25 s');
      await new Promise((r) => setTimeout(r, 120));
    }
  })();
  const mood = await import(`./mood.test.js?v=${v}`);
  render('art direction', mood.run(GAME), 'dark, cold, and blazing where it should be');

  // Last, because it plays three whole games and leaves the sim wherever the
  // final run ended. Anything after it would be measuring a used world.
  const slice = await import(`./slice.test.js?v=${v}`);
  render('the vertical slice', slice.run(GAME), 'three players, three endings, no dead ends');
} catch (e) {
  const h = document.createElement('h2');
  h.className = 'bad';
  h.textContent = `art direction — COULD NOT RUN: ${e.message}`;
  suites.appendChild(h);
  fail += 1;
}

finish();
globalThis.TESTS = { pass, fail };
</script>
</body>
</html>
